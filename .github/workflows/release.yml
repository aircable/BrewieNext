name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 scripts/check_release_tag.py "${GITHUB_REF_NAME}"
      - run: npm run setup
      - run: npm run verify
      - run: npm run package -- "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            releases/*.tar.gz
            releases/*.sha256

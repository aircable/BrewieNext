<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReLinux startup</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; color: #e8f0f4; background: #101820; font: 14px sans-serif; }
    main { width: 90%; max-width: 560px; padding: 24px; border: 1px solid #38515e; border-radius: 12px; background: #172634; }
    h1 { margin: 0 0 8px; color: #65cde6; font-size: 22px; }
    p { color: #a9c2ca; }
    pre { white-space: pre-wrap; color: #dce9ee; font: 12px monospace; }
  </style>
</head>
<body>
  <main>
    <h1>ReLinux / Brewie B20</h1>
    <p id="status">Starting system services...</p>
    <pre id="details">Reading system information...</pre>
  </main>
  <script>
    (function () {
      var status = document.getElementById('status');
      var details = document.getElementById('details');
      var seconds = 3;
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/system-info.json', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var info = JSON.parse(xhr.responseText);
            details.textContent = 'Kernel: ' + info.kernel + '\nRelease: ' + info.release +
              '\nBacklight: ' + info.backlight + '\nTouch: ' + info.touch_device;
          } catch (error) { details.textContent = 'System information is unavailable'; }
        } else { details.textContent = 'System information is unavailable'; }
      };
      try { xhr.send(); } catch (error) { details.textContent = 'System information is unavailable'; }

      var app = new XMLHttpRequest();
      app.open('GET', '/current/index.html', true);
      app.onreadystatechange = function () {
        if (app.readyState !== 4) return;
        if (app.status >= 200 && app.status < 300) {
          status.textContent = 'BrewieNext starting in ' + seconds + '...';
          window.setInterval(function () {
            seconds -= 1;
            if (seconds <= 0) window.location.href = '/current/?kiosk=1';
            else status.textContent = 'BrewieNext starting in ' + seconds + '...';
          }, 1000);
        } else { status.textContent = 'No BrewieNext release installed'; }
      };
      try { app.send(); } catch (error) { status.textContent = 'No BrewieNext release installed'; }
    }());
  </script>
</body>
</html>
